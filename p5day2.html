<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
</head>
<body>
	<script>
		function setup() {
			createCanvas(1500,800);
			noStroke()
			// noLoop()
		}

		function draw(){
			background(200)

			

			for (let i = 0; i < 16; i++){
				for (let j = 0; j < 9; j++){
					let x = i * 100
					let y = j * 100
					let d = dist(x,y,mouseX,mouseY)
					fill("#ffffff")
					circle(x,y,100)
					fill("#000000")
					circle(x-20,y-10,10)
					circle(x+20,y-10,10)
					
					if (d<50){
						
						fill("#ad2b2b")
						arc(x,y+30,50,50,PI,0)
					} else{
						fill("#ad2b2b")
						arc(x,y,50,50,0,PI)
					}

					// if (random() < 0.5){
					// 	fill("#ad2b2b")
					// 	arc(x,y,50,50,0,PI)
					// } else {
					// 	fill("#ad2b2b")
					// 	arc(x,y+30,50,50,PI,0)
					// }
				}
				
			}

			// circle(0,0,100)
			// circle(100,0,100)
			// circle(50,0,100)
			// circle(200,0,100)
			// circle(150,0,100)
			// circle(300,0,100)
			// circle(250,0,100)
			// circle(400,0,100)
			// circle(350,0,100)
			
		}
	</script>
</body>
</html>
