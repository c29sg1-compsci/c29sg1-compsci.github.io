<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
</head>
<body>
	<script>
		let xpos
		let ypos
		let xspeed
		let yspeed
		let color
		function setup(){
			createCanvas(800,800)
			xpos = width/2
			ypos = height/2
			xspeed = 5
			yspeed = 8
			color = "white"

		}

		function draw(){
			background(200)
			// d=changeD(10,100)
			d=50
			// if (xpos > width -25){ //could have done || xpos <25 instead of seperate if
			// 	xspeed *= -1 //equivalent to xspeed=xspeed * -1
			// 	// color="#1F5673"
			// }
			// if (xpos<25){
			// 	xspeed *=-1
			// 	// color="#759FBC"
			// }
			
			// if (ypos > height -25){
			// 	yspeed *= -1
			// 	// color="#90C3C8"
			// }

			// if (ypos<25){
			// 	yspeed *=-1
			// 	// color="#B9B8D3"
			// }
			
			bounce()
			changeBallColor(d)
			
			xpos += xspeed //equivalent to xpos = xpos + xspeed
			ypos += yspeed
			fill(color)
			circle(xpos,ypos,d)
		}
		function bounce(){
			if (xpos +d/2> width || xpos -d/2 <0){
				xspeed *= -1
			}
			if (ypos +d/2> width || ypos -d/2 <0){
				yspeed *= -1
			}
		}
		function changeBallColor(){
			if (xpos>width-25){
				color="#1F5673"
			}

			if (xpos<25){
				color="#759FBC"
			}

			if (ypos>height-25){
				color="#90C3C8"
			}

			if (ypos<25){
				color="#B9B8D3"
			}

		}
	</script>
</body>
</html>
