<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>

	<style type="text/css">

		#alice{
			background-image: url(alice.jpeg);
			height: 500px;
			width: 500px;
			background-repeat: no-repeat;
			background-size: contain;
			position: absolute;
		}
		

	</style>

</head>
<body>

<div id=alice></div>

	<script type="text/javascript">
		document.addEventListener("click",function(){
			alice.style.width = Math.random()*600+"px"
			alice.style.height = Math.random()*600+"px"
		})
		

	</script>

</body>
</html>
