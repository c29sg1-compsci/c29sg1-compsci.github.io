<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>

	<style>
	#badbutton{
		position: absolute;
	}
	</style>
</head>
<body>
	<button id="badbutton">can't click me!</button>
	<script>
		console.log(window.innerWidth)
		let badButton = document.getElementById("badbutton")
		console.log(badButton)
		badButton.addEventListener("click", function(){
			console.log("click")
		})
		badButton.addEventListener("mouseover", function(){
			console.log("over")
			badButton.style.left = Math.random()* window.innerWidth+"px"
			badButton.style.top = Math.random()* window.innerHeight+"px"
			badButton.textContent = badButton.textContent + "!"
		})
		// badButton.addEventListener("mouseout", function(){
		// 	console.log("out")
		// })
	</script>
</body>
</html>
