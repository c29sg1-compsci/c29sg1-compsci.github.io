<!DOCTYPE html>
<html>
<head>
	
	<style type="text/css">
		.confettis{
			width: 10px;
			height: 30px;
			/*border:1px solid black;*/
			/*display: inline-block;*/
			position: absolute;
			/*transform: rotate(45deg);*/
			animation-duration: 3s;
			animation-iteration-count: 1;
			animation-timing-function: linear;
			animation-fill-mode: forwards;
			animation-name: fall;
			top: -10px;

		}

		@keyframes fall{
			0%{
				top: -10px;

			}
			100%{
				top: 1000px;
			}

		}

		body{
			background-color: black;
			background-image: url(congrats.png);
			background-repeat: no-repeat;
			background-size: cover;

		}
	</style>

</head>
<body>

<script type="text/javascript">
	
	function confetti (){
		let confetti = document.createElement("div")
		confetti.classList.add("confettis")
		document.body.appendChild(confetti)

		let r= Math.round(Math.random()*255)
		let g= Math.round(Math.random()*255)
		let b= Math.round(Math.random()*255)

		confetti.style.backgroundColor ="rgb("+ r +","+g+","+b+")"
		// confetti.style.top = Math.random()*5+"px"
		confetti.style.left = Math.random()*1500+"px"
		confetti.style.transform = "rotate"+"("+Math.random()*135+"deg"+")"
		confetti.style.width = Math.random()*15+"px"
		confetti.style.height = Math.random()*45+"px"

	}


setInterval(confetti, 10)

</script>

</body>
</html>
