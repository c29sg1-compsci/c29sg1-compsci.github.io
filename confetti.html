<!DOCTYPE html>
<html>
<head>
	
	<style type="text/css">
		.confettis{
			width: 10px;
			height: 30px;
			/*border:1px solid black;*/
			/*display: inline-block;*/
			position: absolute;
			/*transform: rotate(45deg);*/
			animation-duration: 3s;
			animation-iteration-count: 1;
			animation-timing-function: linear;
			animation-fill-mode: forwards;
			animation-name: spin3d;
			animation-iteration-count: infinite;
			/*animation-name: fall;*/
			animation-direction: alternate;
			animation-timing-function: ease-in-out;
			top: -10px;

		}


		@keyframes spin{
			from {
				/*top: -10px;*/
				
				transform: rotate(var(--startRot));
			}
			to{
				/*top: 1000px;*/
				transform: rotate(var(--endRot));
			}
		}

		@keyframes spin3d{
			from{
				transform: rotateX(-100deg) rotateY(-180deg);
			}
			to{
				transform: rotateX(100deg)rotateY(180deg);
			}
		}

		/*@keyframes fall{
			0%{
				top: -10px;

			}
			100%{
				top: 1000px;
			}

		}*/

		body{
			background-color: white;
			background-image: url(congrats.png);
			background-repeat: no-repeat;
			background-size: cover;

		}
	</style>

</head>
<body>

	<button id="drop">drop confetti</button>
	<input type="color" value="#ff0000" id="picker">

<script type="text/javascript">

	let colors = ["#616163","#44FFD2","#87F6FF","#DAF5FF","FFBFA0"]
	
	let dropConfettiBtn = document.getElementById("drop")

	function confetti (){
		let confetti = document.createElement("div")
		confetti.classList.add("confettis")
		document.body.appendChild(confetti)

		let r= Math.round(Math.random()*255)
		let g= Math.round(Math.random()*255)
		let b= Math.round(Math.random()*255)

		let startRot = Math.random()*-25 + "deg"
		let endRot = Math.random()*25 + "deg"

		let randomColorIndex = Math.floor(Math.random()* colors.length)

		// confetti.style.backgroundColor = colors[randomColorIndex]

		confetti.style.backgroundColor = colorPicker.value

		confetti.style.setProperty("--startRot", startRot)
		confetti.style.setProperty("--endRot", endRot)
		// confetti.style.backgroundColor ="rgb("+ r +","+g+","+b+")"
		confetti.style.top = Math.random()*50+"px"
		confetti.style.left = Math.random()*1500+"px"
		confetti.style.transform = "rotate"+"("+Math.random()*135+"deg"+")"
		confetti.style.width = Math.random()*15+"px"
		confetti.style.height = Math.random()*45+"px"


		function fall() {
			let fallFactor = 10
			confetti.style.top = parseInt(confetti.style.top) + fallFactor + "px"
			// console.log(confetti.style.top)
			if (parseInt (confetti.style.top) > 800){
				confetti.style.top = "10px"
				confetti.style.opacity = 0
			}
		}
		setInterval(fall, 125)

	
	}

setInterval(confetti, 20)

dropConfettiBtn.addEventListener("click", function(){
	for (let i = 0; i < 20; i ++){
		confetti()
	}
})

let colorPicker = document.getElementById("picker")
console.log(colorPicker.value)

</script>

</body>
</html>
