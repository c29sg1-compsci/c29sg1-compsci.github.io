<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style type="text/css">
		#train{
			display: flex;
			gap: 20px;
			/*width: 10px;
			height:10px;*/
			/*border:1px solid black;*/
		}

		.cart{
			border:1px solid black;
			min-width: 100px;
			height: 80px;
			text-align: center;
			position: relative;
		}

		.cart:before{
			content: "";
			display: block;
			height: 30px;
			width:30px;
			border-radius: 50%;
			border: 1px solid black;
			position: absolute;
			bottom: -15px;
			left: 5px;
			background-color: white;

		}

		.cart:after{
			content:"";
			display: block;
			height: 30px;
			width:30px;
			border-radius: 50%;
			border: 1px solid black;
			position: absolute;
			bottom: -15px;
			right: 5px;
			background-color: white;

		}
	</style>
</head>
<body>
	<button id="remove">remove person</button>
	<button id="add">add person</button>

	<input type="text" id="person">

	<div id="train">
		<div class="cart">kate</div>
		<div class="cart">parker</div>
		<div class="cart">sophie</div>
	</div>

	<script>
		let people = ["kate", "parker", "evan"]
		// eventually change to books, and you habe living bookshelf
		// let lastPerson = people.pop()
		

		// adds people to array
		// people.pop()
		// removes last item in array
		console.log(people)

		let addPerson = document.getElementById("add")
		let removePerson = document.getElementById("remove")

		addPerson.addEventListener("click", function(){
			let personInput = document.getElementById("person")
			people.push(personInput.value)
			console.log(people)

		})

		removePerson.addEventListener("click", function(){
			people.pop()
			console.log(people)
		})

		
	
	</script>
</body>
</html>
