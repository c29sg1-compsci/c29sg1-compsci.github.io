<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style type="text/css">
		#train{
			display: flex;
			gap: 20px;
			/*width: 10px;
			height:10px;*/
			/*border:1px solid black;*/
		}

		.cart{
			border:1px solid black;
			min-width: 100px;
			/*width: 100px;*/
			height: 80px;
			text-align: center;
			position: relative;
		}

		.cart:before{
			content: "";
			display: block;
			height: 30px;
			width:30px;
			border-radius: 50%;
			border: 1px solid black;
			position: absolute;
			bottom: -15px;
			left: 5px;
			background-color: white;

		}

		.cart:after{
			content:"";
			display: block;
			height: 30px;
			width:30px;
			border-radius: 50%;
			border: 1px solid black;
			position: absolute;
			bottom: -15px;
			right: 5px;
			background-color: white;

		}
	</style>
</head>
<body>
	<button id="remove">remove person</button>
	<button id="add">add person</button>

	<input type="text" id="person">
	<input type="color" value="#ffffff" id="colorPicker">

	<div id="train">
		<!-- <div class="cart">kate</div>
		<div class="cart">parker</div>
		<div class="cart">sophie</div> -->
	</div>

	
	<script>

		let kate = {
			name: "kate",
			studentId: "c28kk",
			pronouns: "she/her"
		}

		let people = [
			{

			}

		// let people = [

// i stands for index or item? im not sure tbh
// i ++ means i + 1
		let train = document.getElementById("train")
		let  colorPicker = document.getElementById("colorPicker")
		
		function makeTrain(){
			train.innerHTML = ""
			for(let i = 0; i < people.length; i ++){
				console.log(people[i])
				let cart = document.createElement("div")
				cart.classList.add("cart")
				cart.textContent = people[i].name
				console.log(people[i].fav_color)
				cart.style.backgroundColor = people[i].fav_color
				train.appendChild(cart)
			}

		}

		makeTrain()
		

	
		let addPerson = document.getElementById("add")
		let removePerson = document.getElementById("remove")

		


		// eventually change to books, and you have living tbr

		// let lastPerson = people.pop()

		// people.pop()
		// removes last item in array
		console.log(people)

		

		addPerson.addEventListener("click", function(){
			let personInput = document.getElementById("person")
			people.push({
				name: personInput.value,
				fav_color: colorPicker.value
			})
			makeTrain()

			console.log(people)
			

		})



		removePerson.addEventListener("click", function(){
			people.pop()
			console.log(people)
			makeTrain()
		
		})

		


		
	
	</script>
