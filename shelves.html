<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style type="text/css">
		#train{
			display: flex;
			gap: 20px;
			/*width: 10px;
			height:10px;*/
			/*border:1px solid black;*/
		}

		.cart{
			border:1px solid black;
			min-width: 100px;
			/*width: 100px;*/
			height: 80px;
			text-align: center;
			position: relative;
		}

		.cart:before{
			content: "";
			display: block;
			height: 30px;
			width:30px;
			border-radius: 50%;
			border: 1px solid black;
			position: absolute;
			bottom: -15px;
			left: 5px;
			background-color: white;

		}

		.cart:after{
			content:"";
			display: block;
			height: 30px;
			width:30px;
			border-radius: 50%;
			border: 1px solid black;
			position: absolute;
			bottom: -15px;
			right: 5px;
			background-color: white;

		}
	</style>
</head>
<body>
	<button id="remove">remove person</button>
	<button id="add">add person</button>

	<input type="text" id="person">

	<div id="train">
		<!-- <div class="cart">kate</div>
		<div class="cart">parker</div>
		<div class="cart">sophie</div> -->
	</div>

	
	<script>
		let people = ["kate", "parker", "sophie"]
// i stands for index or item? im not sure tbh
// i ++ means i + 1
		let train = document.getElementById("train")
		
		function makeTrain(){
			train.innerHTML = ""
			for(let i = 0; i < people.length; i ++){
				console.log(people[i])
				let cart = document.createElement("div")
				cart.classList.add("cart")
				cart.textContent = people [i]
				train.appendChild(cart)
			}

		}

		makeTrain()
		

	
		let addPerson = document.getElementById("add")
		let removePerson = document.getElementById("remove")

		


		// eventually change to books, and you have living tbr
		// could have thing where when you click on each book, it gives info, rating on goodreads, synopsis, and how long ago it was you said you would read it
		// let lastPerson = people.pop()
		
		// people.push()
		// adds people to array
		// people.pop()
		// removes last item in array
		console.log(people)

		

		addPerson.addEventListener("click", function(){
			let personInput = document.getElementById("person")
			makeTrain()
			people.push(personInput.value)
			console.log(people)
			

		})



		removePerson.addEventListener("click", function(){
			people.pop()
			console.log(people)
			makeTrain()
		
		})

		


		
	
	</script>
</body>
</html>
