<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style>
		.container{
			display:grid;
			/*grid-template-columns: auto auto auto;*/
			grid-template-columns: repeat(4, 1fr);

		}
		.item{
			border: 1px solid black;
			/*max-height: 300px;
			height: 300px;
			overflow: hidden;*/
		}

		.item img{
			width: 100%;
			object-fit:cover;
		}

		#item1 {
			grid-column: 1/3;
		}
		#item2 {
			grid-column: 3/5;
		}

		@media (max-width: 800px){
			.container{

				grid-template-columns: auto auto auto;
			}
			#item1 {
				grid-column: 1/1;
			}
			#item2 {
				grid-column: 2/2;
			}
		}

	</style>
</head>
<body>
	<div class="container">
		<div class="item" id="item1">
			<img src="bros.jpg" alt="bros">
		</div>
		<div class="item" id="item2">
			<img src="disney.jpg" alt="disney">
		</div>
		<div class="item">
			<img src="family.jpg" alt="fam">
		</div>
		<div class="item">
			<img src="tree.jpg" alt="tree">
		</div>
		<div class="item">
			<img src="Jgrad.jpg" alt="jgrad">
		</div>
		<div class="item">
			<img src="Zgrad.jpg" alt="zgrad">
		</div>
			<div class="item">
			<img src="photoshop.jpg" alt="photoshop">
		</div>

	</div>
</body>
</html>
